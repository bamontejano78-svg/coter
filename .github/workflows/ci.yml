# ============================================================
# Coter Pro — CI/CD Pipeline
# ============================================================
# GitHub Secrets requeridos:
#
#   ── Tests ───────────────────────────────────────────────
#   TEST_DB_PASSWORD      — Contraseña de la BD de test (Postgres service container)
#   TEST_JWT_SECRET       — JWT secret para entorno de test
#   TEST_ENCRYPTION_KEY   — Clave de cifrado (64 chars hex) para tests
#
#   ── GHCR ────────────────────────────────────────────────
#   GITHUB_TOKEN          — Automático: usado para login y push a GHCR
#
#   ── Security Scan ───────────────────────────────────────
#   (usa Trivy de Aqua Security — open source, sin secrets adicionales)
#
#   ── Deploy Staging ──────────────────────────────────────
#   SSH_HOST              — IP o dominio del servidor de staging
#   SSH_USER              — Usuario SSH con permisos Docker
#   SSH_PRIVATE_KEY       — Clave privada SSH (sin passphrase, o con ssh-agent)
#   SSH_PORT              — (opcional) Puerto SSH, default 22
#   STAGING_DEPLOY_PATH   — Ruta en el servidor donde está docker-compose.staging.yml
# ============================================================
name: Coter Pro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Registry de imágenes Docker
  REGISTRY: ghcr.io

jobs:
  # ─── TESTS ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coter_test
          POSTGRES_USER: coter
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://coter:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/coter_test
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
          CORS_ORIGINS: http://localhost:3000
          DB_CONNECTION_TIMEOUT_MS: 15000

  # ─── DOCKER BUILD, SCAN & PUSH ──────────────────────────
  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: test
    # Solo push en main, no en PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write        # Necesario para push a GHCR
      security-events: write # Para subir reporte SARIF al Security tab
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            # Branch name (main → main)
            type=ref,event=branch
            # Git short SHA (e.g., a1b2c3d)
            type=sha,prefix=,format=short
            # Semver tags from git tags (v1.0.0 → 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest alias (solo en main)
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Coter Pro
            org.opencontainers.image.description=Plataforma de continuidad terapéutica entre sesiones
            org.opencontainers.image.vendor=Coter

      # ── Paso 1: Build (sin push) → carga en Docker daemon ──
      - name: Build image (for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Paso 2: Security scan con Trivy (informativo, no bloqueante) ──
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:main
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          timeout: 10m

      # ── Paso 3: Subir reporte al Security tab de GitHub ────
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      # ── Paso 4: Push a GHCR ──
      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ─── DEPLOY STAGING ─────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://coter.app

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE="${{ env.REGISTRY }}/${{ github.repository }}:main"
            echo "📥 Pulling: $IMAGE"
            docker pull "$IMAGE"

            cd "${{ secrets.STAGING_DEPLOY_PATH || '/opt/coter-staging' }}"

            echo "🚀 Restarting API with new image..."
            API_IMAGE="$IMAGE" \
              docker compose -f docker-compose.staging.yml up -d --no-build --force-recreate api

            echo "⏳ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ API healthy after $((i * 2))s"
                break
              fi
              [ $i -eq 30 ] && echo "❌ Health check timeout" && exit 1
              sleep 2
            done

            echo "🧹 Pruning dangling images (>24h old)..."
            docker image prune -af --filter "until=24h" || true

            echo "✅ Deploy complete!"
