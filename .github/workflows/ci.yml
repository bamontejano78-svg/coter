# ============================================================
# Coter Pro — CI/CD Pipeline
# ============================================================
# GitHub Secrets requeridos:
#
#   ── Tests ───────────────────────────────────────────────
#   TEST_DB_PASSWORD      — Contraseña de la BD de test (Postgres service container)
#   TEST_JWT_SECRET       — JWT secret para entorno de test
#   TEST_ENCRYPTION_KEY   — Clave de cifrado (64 chars hex) para tests
#
#   ── GHCR ────────────────────────────────────────────────
#   GITHUB_TOKEN          — Automático: usado para login y push a GHCR
#
#   ── Deploy Staging ──────────────────────────────────────
#   SSH_HOST              — IP o dominio del servidor de staging
#   SSH_USER              — Usuario SSH con permisos Docker
#   SSH_PRIVATE_KEY       — Clave privada SSH (sin passphrase, o con ssh-agent)
#   SSH_PORT              — (opcional) Puerto SSH, default 22
#   STAGING_DEPLOY_PATH   — Ruta en el servidor donde está docker-compose.staging.yml
#   STAGING_URL           — URL HTTPS pública para smoke test
# ============================================================
name: Coter Pro CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Registry de imágenes Docker
  REGISTRY: ghcr.io

jobs:
  # ─── TESTS ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coter_test
          POSTGRES_USER: coter
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://coter:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/coter_test
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
          CORS_ORIGINS: http://localhost:3000
          DB_CONNECTION_TIMEOUT_MS: 15000

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Backup and restore drill
        run: npm run test:backup-restore
        env:
          NODE_ENV: test
          SOURCE_DATABASE_URL: postgresql://coter:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/coter_test
          DRILL_ADMIN_DATABASE_URL: postgresql://coter:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/postgres

  # ─── DOCKER BUILD & PUSH ──────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    # Solo push en main, no en PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Coter Pro
            org.opencontainers.image.description=Plataforma de continuidad terapéutica entre sesiones
            org.opencontainers.image.vendor=Coter

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ─── DEPLOY STAGING ─────────────────────────────────────
  # El job solo se habilita cuando existen todos los secretos SSH. Así un
  # pipeline sin infraestructura configurada no se presenta como desplegado.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify staging secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -e
          for value in SSH_HOST SSH_USER SSH_PRIVATE_KEY STAGING_DEPLOY_PATH STAGING_URL; do
            test -n "${!value}" || { echo "Missing required secret: $value"; exit 1; }
          done

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            test -f .env.staging || { echo "Missing .env.staging on staging host"; exit 1; }
            export API_IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            docker compose --env-file .env.staging -f docker-compose.staging.yml config >/dev/null
            docker compose --env-file .env.staging -f docker-compose.staging.yml pull api
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --no-build --force-recreate
            for i in $(seq 1 30); do
              if curl -kfsS https://localhost/api/health >/dev/null; then exit 0; fi
              sleep 2
            done
            docker compose --env-file .env.staging -f docker-compose.staging.yml logs --tail=100 api
            exit 1

      - name: Staging smoke test
        run: node scripts/staging-smoke.js
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
