# ============================================================
# Coter Pro — CI/CD Pipeline
# ============================================================
# GitHub Secrets requeridos:
#
#   ── Tests ───────────────────────────────────────────────
#   TEST_DB_PASSWORD      — Contraseña de la BD de test (Postgres service container)
#   TEST_JWT_SECRET       — JWT secret para entorno de test
#   TEST_ENCRYPTION_KEY   — Clave de cifrado (64 chars hex) para tests
#
#   ── GHCR ────────────────────────────────────────────────
#   GITHUB_TOKEN          — Automático: usado para login y push a GHCR
#
#   ── Deploy Staging ──────────────────────────────────────
#   SSH_HOST              — IP o dominio del servidor de staging
#   SSH_USER              — Usuario SSH con permisos Docker
#   SSH_PRIVATE_KEY       — Clave privada SSH (sin passphrase, o con ssh-agent)
#   SSH_PORT              — (opcional) Puerto SSH, default 22
#   STAGING_DEPLOY_PATH   — Ruta en el servidor donde está docker-compose.staging.yml
# ============================================================
name: Coter Pro CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Registry de imágenes Docker
  REGISTRY: ghcr.io

jobs:
  # ─── TESTS ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coter_test
          POSTGRES_USER: coter
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://coter:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/coter_test
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
          CORS_ORIGINS: http://localhost:3000
          DB_CONNECTION_TIMEOUT_MS: 15000

  # ─── DOCKER BUILD & PUSH ──────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    # Solo push en main, no en PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Coter Pro
            org.opencontainers.image.description=Plataforma de continuidad terapéutica entre sesiones
            org.opencontainers.image.vendor=Coter

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── DEPLOY STAGING ─────────────────────────────────────
  # Salta con warning si los secrets SSH no están configurados.
  # Para deploy local: ejecuta scripts/deploy-staging-local.sh
  # NOTA: Cuando tengas servidor, configura el environment "staging"
  # en Settings > Environments y añade los secrets SSH_HOST/USER/etc.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Check SSH availability
        id: check-ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "ssh_available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Faltan credenciales SSH — saltando deploy remoto"
            echo "💡 Ejecuta scripts/deploy-staging-local.sh en tu máquina para deploy local"
          else
            echo "ssh_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.check-ssh.outputs.ssh_available == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE="${{ env.REGISTRY }}/${{ github.repository }}:main"
            echo "📥 Pulling: $IMAGE"
            docker pull "$IMAGE"

            cd "${{ secrets.STAGING_DEPLOY_PATH || '/opt/coter-staging' }}"

            echo "🚀 Restarting API with new image..."
            API_IMAGE="$IMAGE" \
              docker compose -f docker-compose.staging.yml up -d --no-build --force-recreate api

            echo "⏳ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ API healthy after $((i * 2))s"
                break
              fi
              [ $i -eq 30 ] && echo "❌ Health check timeout" && exit 1
              sleep 2
            done

            echo "🧹 Pruning dangling images (>24h old)..."
            docker image prune -af --filter "until=24h" || true

            echo "✅ Deploy complete!"
