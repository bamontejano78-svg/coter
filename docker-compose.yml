version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: coter-db
    environment:
      POSTGRES_DB: coter
      POSTGRES_USER: coter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    # PostgreSQL solo es accesible desde la red Docker; no se publica al host.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coter -d coter']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - coter

  # API
  api:
    image: ${API_IMAGE:?API_IMAGE must be set}
    build: .
    container_name: coter-api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://coter:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/coter
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS must be set}
      SMTP_FROM: ${SMTP_FROM:-noreply@coter.app}
      APP_URL: ${APP_URL:-https://coter.app}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      PIONEER_NOTIFY_EMAIL: ${PIONEER_NOTIFY_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:?STRIPE_PRICE_ID must be set}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      FCM_SENDER_ID: ${FCM_SENDER_ID:-}
      CRON_REMINDERS: ${CRON_REMINDERS:-}
      CRON_BILLING: ${CRON_BILLING:-}
      CRON_ALERTS: ${CRON_ALERTS:-}
      CRON_REMINDERS_RUN_AT_START: ${CRON_REMINDERS_RUN_AT_START:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - coter
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx (reverse proxy + SSL)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        ENV: production
    container_name: coter-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Let's Encrypt certificates (se montan desde el host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - coter_certbot_www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - coter

  # Certbot — una ejecución por renovación, invocada por cron/systemd del host.
  # La recarga de Nginx se realiza fuera de este contenedor para no montar
  # el socket Docker ni conceder privilegios innecesarios a Certbot.
  certbot:
    image: certbot/certbot:latest
    container_name: coter-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - coter_certbot_www:/var/www/certbot
    entrypoint: ["certbot"]
    command: ["renew", "--quiet"]
    networks:
      - coter

volumes:
  pgdata:
  coter_certbot_www:
    name: coter_certbot_www

networks:
  coter:
    driver: bridge
