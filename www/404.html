  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/landing.css">
  <style>
    .error-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 28px;
      position: relative;
      z-index: 1;
    }
    .error-card {
      max-width: 520px;
      animation: fadeInUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .error-code {
      font-family: 'Inter Tight', sans-serif;
      font-size: clamp(80px, 12vw, 140px);
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1;
      color: var(--ink, #0f172a);
      margin-bottom: 16px;
    }
    .error-code span {
      background: linear-gradient(135deg, var(--primary, #5b5ce2), #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-title {
      font-family: 'Inter Tight', sans-serif;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: -.03em;
      color: var(--ink, #0f172a);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 16px;
      color: var(--muted, #64748b);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .error-illustration {
      margin-bottom: 32px;
      display: inline-block;
    }
    .error-illustration svg {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="page-glow glow-one" aria-hidden="true"></div>
  <div class="page-glow glow-two" aria-hidden="true"></div>
  <div class="page-grid" aria-hidden="true"></div>

  <main class="error-page">
    <div class="error-card">
      <div class="error-illustration" aria-hidden="true">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#e2e8f0" stroke-width="1.5"/>
          <path d="M 20 7.5 A 9 9 0 1 0 20 16.5" fill="none" stroke="url(#g404)" stroke-width="3" stroke-linecap="round"/>
          <defs>
            <linearGradient id="g404" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="#5b5ce2"/>
              <stop offset="1" stop-color="#2dd4bf"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <div class="error-code">4<span>0</span>4</div>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-desc">
        La página que buscas no existe o ha sido movida. Puede que el enlace esté roto o que la dirección no sea correcta.
      </p>        <div class="error-actions">
          <a href="/" class="button button-primary">Volver al inicio</a>
          <a href="/terapeuta.html" class="button button-secondary">Área profesional</a>
        </div>
    </div>
  </main>
</body>
</html>
