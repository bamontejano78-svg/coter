# Render Blueprint — Coter Pro (staging sin Docker)
#
# Importa este archivo desde Render usando "New > Blueprint".
# Las variables marcadas sync:false se completan en el dashboard y nunca se
# guardan en Git. DATABASE_URL debe ser la Internal Database URL de Render Postgres
# con TLS explicito (`sslmode=verify-full`) si Render no lo incluye en la URL.

services:
  - type: web
    name: coter-staging
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_POOL_MAX
        value: "5"
      - key: CRON_REMINDERS_RUN_AT_START
        value: "false"
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PIONEER_NOTIFY_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: FCM_SENDER_ID
        sync: false
